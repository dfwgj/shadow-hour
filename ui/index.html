<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calendar App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using Google Fonts for a premium look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-top">
                <h1 class="current-date">2025年11月</h1>
            </div>

            <!-- View Switcher -->
            <div class="view-switcher">
                <div class="view-tab" data-view="year">年</div>
                <div class="view-tab active" data-view="month">月</div>
                <div class="view-tab" data-view="week">周</div>
                <div class="view-tab" data-view="schedule">日程</div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Year View Section -->
            <div id="yearView" class="year-view-section" style="display: none;">
                <!-- 12 Months Grid Placeholder -->
                <div class="year-grid">
                    <div class="month-mini">1月</div>
                    <div class="month-mini">2月</div>
                    <div class="month-mini">3月</div>
                    <div class="month-mini">4月</div>
                    <div class="month-mini">5月</div>
                    <div class="month-mini">6月</div>
                    <div class="month-mini">7月</div>
                    <div class="month-mini">8月</div>
                    <div class="month-mini">9月</div>
                    <div class="month-mini">10月</div>
                    <div class="month-mini">11月</div>
                    <div class="month-mini">12月</div>
                </div>
            </div>

            <!-- Calendar Grid Section -->
            <div class="calendar-section" id="calendarSection">
                <div class="weekdays-header">
                    <span>一</span>
                    <span>二</span>
                    <span>三</span>
                    <span>四</span>
                    <span>五</span>
                    <span>六</span>
                    <span>日</span>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Days will be injected by JS -->
                </div>
                <div class="calendar-footer-handle"></div>
            </div>

            <!-- Month View Events Section -->
            <div class="month-events-section" id="monthEvents">
                <div class="today-info">
                    <span>今天 农历十月十一</span>
                    <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20">
                        <path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z" />
                    </svg>
                </div>

                <div class="event-card">
                    <div class="event-indicator blue"></div>
                    <div class="event-content">
                        <div class="event-title">【哔哩哔哩】你预约的《@食贫道...</div>
                        <div class="event-time">
                            <div>20:30</div>
                            <div>21:30</div>
                        </div>
                    </div>
                </div>

                <div class="event-card">
                    <div class="event-indicator yellow-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 -960 960 960" width="16">
                            <path d="m382-354 308-308-57-57-251 251-114-114-57 57 171 171Z" />
                        </svg>
                    </div>
                    <div class="event-content">
                        <div class="event-title">黄历 | 乙巳蛇年</div>
                        <div class="event-subtitle">十月十一</div>
                    </div>
                    <button class="add-event-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24">
                            <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Schedule/Timeline Section (Hidden by default for Month View) -->
            <div class="schedule-section" id="dayTimeline" style="display: none;">
                <!-- Timeline items will go here -->
                <div class="timeline-container">
                    <div class="time-slot" data-time="08">08</div>
                    <div class="time-slot" data-time="09">09</div>
                    <div class="time-slot" data-time="10">10</div>
                    <div class="time-slot" data-time="11">11</div>
                    <div class="time-slot" data-time="12">12</div>
                    <div class="time-slot" data-time="13">13</div>
                    <div class="time-slot" data-time="14">14</div>
                    <div class="time-slot" data-time="15">15</div>
                    <div class="time-slot" data-time="16">16</div>
                    <div class="time-slot" data-time="17">17</div>
                    <div class="time-slot" data-time="18">18</div>
                    <div class="time-slot" data-time="19">19</div>
                    <div class="time-slot" data-time="20">20</div>
                </div>
            </div>
        </main>

        <!-- FAB -->
        <button class="fab">
            <svg xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="32">
                <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
            </svg>
        </button>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active">
                <div class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24">
                        <path
                            d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Z" />
                    </svg>
                </div>
                <span class="nav-label">日程</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24">
                        <path
                            d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Zm280 240q-17 0-28.5-11.5T440-440q0-17 11.5-28.5T480-480q17 0 28.5 11.5T520-440q0 17-11.5 28.5T480-400Z" />
                    </svg>
                </div>
                <span class="nav-label">我的一天</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24">
                        <path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z" />
                    </svg>
                </div>
                <span class="nav-label">待办</span>
            </div>
        </nav>
    </div>
    <script src="script.js"></script>
</body>

</html>
